<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirect Crawler</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; }
    input, button { padding: 0.5rem; margin: 0.5rem 0.25rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>Redirect Crawler</h1>

  <input type="text" id="siteUrl" placeholder="Enter live site URL (e.g., https://example.com)">
  <button onclick="crawlSitemap()">Crawl Sitemap</button>

  <table id="resultsTable" style="display:none;">
    <thead>
      <tr>
        <th>Old URL Slug</th>
        <th>New URL</th>
        <th>Explanation</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button id="downloadBtn" style="display:none;" onclick="downloadCSV()">Download CSV</button>

  <script>
    let redirects = [];

    function explainRedirect(url) {
      if (!url || url === "/") return "Redirected to homepage";
      if (url.includes("locations/")) return "Redirected to location-specific page";
      if (url.includes("blog")) return "Redirected to blog";
      if (url.includes("contact")) return "Redirected to contact page";
      if (url.includes("about")) return "Redirected to about page";
      return `Redirected to ${url}`;
    }

    async function crawlSitemap() {
      const site = document.getElementById("siteUrl").value.trim().replace(/\/+$/, "");
      if (!site.startsWith("http")) return alert("Include http:// or https:// in the URL");

      const sitemapUrl = site + "/sitemap.xml";
      try {
        const res = await fetch(sitemapUrl);
        const text = await res.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, "application/xml");
        const locTags = xml.getElementsByTagName("loc");

        redirects = [];
        const table = document.querySelector("#resultsTable tbody");
        table.innerHTML = "";

        for (let i = 0; i < locTags.length; i++) {
          const fullUrl = locTags[i].textContent;
          const slug = new URL(fullUrl).pathname.replace(/^\\//, "");
          redirects.push({ oldUrl: slug, newUrl: "", explanation: "" });

          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${slug}</td>
            <td><input type="text" placeholder="/new-path" oninput="updateRedirect(${i}, this.value)"></td>
            <td id="explain-${i}"></td>
          `;
          table.appendChild(row);
        }

        document.getElementById("resultsTable").style.display = "table";
        document.getElementById("downloadBtn").style.display = "inline-block";

      } catch (err) {
        alert("Failed to fetch sitemap: " + err.message);
      }
    }

    function updateRedirect(index, newUrl) {
      redirects[index].newUrl = newUrl;
      redirects[index].explanation = explainRedirect(newUrl);
      document.getElementById("explain-" + index).innerText = redirects[index].explanation;
    }

    function downloadCSV() {
      const rows = [["oldUrl", "newPageName", "explanation"], ...redirects.map(r => [r.oldUrl, r.newUrl, r.explanation])];
      const csv = rows.map(r => r.map(v => `"${v}"`).join(",")).join("\\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", "redirects.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
