<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Compare Sitemaps</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; }
    input, button { padding: 0.5rem; margin: 0.5rem 0.25rem; width: 100%; }
    textarea { width: 100%; height: 200px; margin-top: 1rem; }
    .column { float: left; width: 48%; padding: 1%; }
    .row::after { content: ""; display: table; clear: both; }
    h2 { margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>Sitemap Redirect Builder</h1>

  <label>Old Site URL:</label>
  <input id="site1" placeholder="https://oldsite.com" />

  <label>New Site URL:</label>
  <input id="site2" placeholder="https://newsite.com" />

  <button onclick="compareSitemaps()">Fetch Sitemaps</button>

  <div class="row">
    <div class="column">
      <h2>Old Site Pages</h2>
      <textarea id="site1Output" readonly></textarea>
    </div>
    <div class="column">
      <h2>New Site Pages</h2>
      <textarea id="site2Output" readonly></textarea>
    </div>
  </div>

  <script>
    async function compareSitemaps() {
      const site1 = document.getElementById("site1").value.trim();
      const site2 = document.getElementById("site2").value.trim();
      const endpoint = `https://redirect.jordan-evans.workers.dev/?site1=${encodeURIComponent(site1)}&site2=${encodeURIComponent(site2)}`;

      try {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error("Error fetching sitemap data");

        const data = await res.json();
        document.getElementById("site1Output").value = data.site1.join("\n");
        document.getElementById("site2Output").value = data.site2.join("\n");

      } catch (err) {
        alert("Failed to fetch sitemaps: " + err.message);
      }
    }
  </script>
</body>
</html>
