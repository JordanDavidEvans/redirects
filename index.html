<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sitemap Slug Extractor</title>
  <style>
    body { font-family: sans-serif; padding: 1em; }
    textarea { width: 100%; height: 100px; }
    #log { white-space: pre-wrap; background: #111; color: #0f0; padding: 1em; margin-top: 1em; height: 200px; overflow: auto; }
    iframe { display: none; }
  </style>
</head>
<body>
  <h2>🧠 Sitemap Slug Extractor (Browser-based)</h2>
  <label for="site">Enter full site URL (http:// or https://):</label><br>
  <input type="text" id="site" placeholder="http://example.com"><br><br>
  <button onclick="extractSlugs()">Extract Sitemap Slugs</button>

  <div id="log">Logs will appear here...</div>
  <iframe id="sitemapFrame"></iframe>

  <script>
    function log(message) {
      document.getElementById("log").textContent += message + "\n";
    }

    async function extractSlugs() {
      const site = document.getElementById("site").value.trim().replace(/\/+$/, '');
      const sitemapUrl = site + "/sitemap.xml";
      log("📡 Trying to load sitemap: " + sitemapUrl);

      const iframe = document.getElementById("sitemapFrame");
      iframe.src = sitemapUrl;

      iframe.onload = () => {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          const locs = [...doc.querySelectorAll("loc")].map(loc => loc.textContent.trim());
          const slugs = locs.map(url => {
            try {
              return new URL(url).pathname.replace(/^\/+/, '');
            } catch {
              return '';
            }
          }).filter(Boolean);

          log(`✅ Found ${slugs.length} slugs:\n` + slugs.join('\n'));
        } catch (err) {
          log("❌ Error reading iframe content (maybe blocked): " + err.message);
        }
      };

      iframe.onerror = () => {
        log("❌ Failed to load sitemap in iframe.");
      };
    }
  </script>
</body>
</html>
