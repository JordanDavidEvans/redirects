<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirect Manager</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 1rem; }
    input, button { padding: 0.5rem; margin: 0.25rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>Redirect Manager</h1>

  <input type="text" id="oldUrl" placeholder="Old URL (slug only)">
  <input type="text" id="newUrl" placeholder="New Page URL (slug only)">
  <button onclick="addRedirect()">Add</button>
  <button onclick="downloadCSV()">Download CSV</button>

  <table id="redirectTable">
    <thead>
      <tr>
        <th>Old URL</th>
        <th>New URL</th>
        <th>Explanation</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const redirects = [];

    function explainRedirect(url) {
      if (!url || url === "/") return "Redirected to homepage";
      if (url.includes("locations/")) return "Redirected to location-specific page";
      if (url.includes("blog")) return "Redirected to blog";
      if (url.includes("contact")) return "Redirected to contact page";
      if (url.includes("about")) return "Redirected to about page";
      return `Redirected to ${url}`;
    }

    function addRedirect() {
      const oldInput = document.getElementById("oldUrl");
      const newInput = document.getElementById("newUrl");
      const oldUrl = oldInput.value.trim();
      const newUrl = newInput.value.trim();

      if (!oldUrl) return alert("Old URL is required");

      const explanation = explainRedirect(newUrl);
      redirects.push({ oldUrl, newUrl, explanation });

      const row = document.createElement("tr");
      row.innerHTML = `<td>${oldUrl}</td><td>${newUrl}</td><td>${explanation}</td>`;
      document.querySelector("#redirectTable tbody").appendChild(row);

      oldInput.value = "";
      newInput.value = "";
    }

    function downloadCSV() {
      const rows = [["oldUrl", "newPageName", "explanation"], ...redirects.map(r => [r.oldUrl, r.newUrl, r.explanation])];
      const csv = rows.map(r => r.map(v => `"${v}"`).join(",")).join("\\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", "redirects.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
