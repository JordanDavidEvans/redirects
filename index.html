<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitemap to CSV Exporter</title>
</head>
<body>
  <h2>Sitemap to CSV Exporter</h2>

  <input id="sitemap-url" type="text" placeholder="Enter sitemap.xml URL" style="width:400px;">
  <button onclick="exportCSV()">Export CSV</button>

  <script>
    async function exportCSV() {
      const urlInput = document.getElementById('sitemap-url').value.trim();
      console.log("Fetching sitemap from:", urlInput); // Debugging log

      if (!urlInput) {
        alert('Please enter a valid URL.');
        return;
      }

      try {
        const response = await fetch('https://redirect.jordan-evans.workers.dev/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sitemap: urlInput })
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const csvData = await response.text();

        // Trigger file download
        const blob = new Blob([csvData], { type: 'text/csv' });
        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = 'sitemap.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (error) {
        console.error('Error:', error);
        alert('Failed to fetch or convert sitemap.');
      }
    }
  </script>
</body>
</html>
